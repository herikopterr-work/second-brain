<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Brain & Lightning Emblem -->
  <g transform="translate(106, 106) scale(0.585)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere -->
    <path d="M230,100 C180,70 120,100 110,160 C90,170 70,210 80,260 C70,300 90,350 130,370 C140,410 190,440 240,410" stroke-width="26" />
    <path d="M110,160 C140,190 190,190 230,200" stroke-width="22" stroke-opacity="0.8" />
    <path d="M80,260 C120,270 170,260 230,280" stroke-width="22" stroke-opacity="0.8" />
    <path d="M130,370 C160,340 200,350 240,340" stroke-width="22" stroke-opacity="0.8" />
    
    <!-- Right Hemisphere -->
    <path d="M282,100 C332,70 392,100 402,160 C422,170 442,210 432,260 C442,300 422,350 382,370 C372,410 322,440 272,410" stroke-width="26" />
    <path d="M402,160 C372,190 322,190 282,200" stroke-width="22" stroke-opacity="0.8" />
    <path d="M432,260 C392,270 342,260 282,280" stroke-width="22" stroke-opacity="0.8" />
    <path d="M382,370 C352,340 312,350 272,340" stroke-width="22" stroke-opacity="0.8" />

    <!-- Center Lightning Bolt (Capture / Spark) -->
    <polygon points="256,120 230,240 266,240 246,360 290,220 254,220" fill="#34d399" stroke="#34d399" stroke-width="8" />
  </g>
</svg>
